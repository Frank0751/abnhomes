# The Supabase free tier suspends a project after about a week without
# activity, which would take the demo site down silently. This job touches
# the database twice a day so that never happens.
#
# The connection string lives in the repository secret
# SUPABASE_KEEPALIVE_DATABASE_URL — the repo is public and the value must
# never sit in this file.
name: Supabase keep-alive

on:
  push:
    branches: [main] # also runs whenever a deploy goes out
  schedule:
    - cron: '23 3,15 * * *' # twice daily, off the hour
  workflow_dispatch: # lets us trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          # psql must not get Prisma's pgbouncer/connection_limit parameters —
          # libpq rejects them as unknown URI query parameters.
          DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT 'supabase keep-alive', now() AS at;" \
            -c "SELECT 'reservations' AS what, count(*) FROM \"Reservation\"
                UNION ALL SELECT 'parties', count(*) FROM \"Party\"
                UNION ALL SELECT 'tickets', count(*) FROM \"Ticket\";"
